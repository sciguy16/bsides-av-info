[package]
name = "bsides-schedule-converter"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
color-eyre = "0.6.5"
csv = "1.4.0"
either = "1.19.0"
icalendar = { version="0.17.14", default-features = false}
indexmap = { version = "2.14.0", features = ["serde"] }
itertools = "0.15.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["blocking"] }
rust_xlsxwriter = { version = "0.99.0", features = ["serde"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_with = { version = "3.24.0", default-features = false, features = ["alloc", "macros"] }

[dev-dependencies]
insta = { version = "1.48.0", features = ["yaml"] }
pretty_assertions = "1.4.1"
tempfile = "3.27.0"

[lints.clippy]
invalid_regex="deny"
